[package]
name = "biblio-ui"
version.workspace = true
edition.workspace = true
publish = false
description = "Biblio native NSH views and controls"

[dependencies]
biblio-core = { path = "../biblio-core" }
nsh-core = "=0.4.0"
nsh-base = { version = "=0.4.0", default-features = false }
rfd = "0.16"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7"
open = "5"
url = "2"
base64 = "0.23"

[dev-dependencies]
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-text = { version = "0.3", default-features = false, features = ["CTFontManager"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString"] }

[target.'cfg(target_os = "linux")'.dependencies]
pango = "0.22"
pangocairo = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }
