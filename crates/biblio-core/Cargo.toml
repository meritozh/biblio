[package]
name = "biblio-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Biblio catalog, storage, import pipelines and background workers"

[dependencies]
open = "5"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
fancy-regex = "0.20"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
infer = "0.22"
rig = { package = "rig-core", version = "0.37" }
schemars = "1"
charset-normalizer-rs = "1.1"
encoding_rs = "0.8"
zip = "8"
unrar = "0.5"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["form", "json", "multipart"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md-5 = "0.11"
urlencoding = "2"
unicode-normalization = "0.1"
trash = "5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
rand = "0.10"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
